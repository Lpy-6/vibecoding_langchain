[project]
name = "rag-ecommerce-backend"
version = "0.1.0"
description = "Enterprise RAG knowledge base QA system for e-commerce (LangChain)"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32",
  "sqlalchemy[asyncio]>=2.0.36,<3",
  "aiosqlite>=0.20",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.6",
  "python-multipart>=0.0.12",
  "PyJWT>=2.9",
  "argon2-cffi>=23.1",
  "httpx>=0.27",
  "langchain>=1.0,<2",
  "langchain-core>=1.0,<2",
  "langchain-openai>=1.0,<2",
  "langchain-text-splitters>=0.3",
  "numpy>=1.26",
  "jieba>=0.42.1",
  "rank-bm25>=0.2.2",
  "PyMuPDF>=1.24",
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "beautifulsoup4>=4.12",
  "trafilatura>=1.12",
  "prometheus-client>=0.21",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5",
  "respx>=0.21",
  "locust>=2.29",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
